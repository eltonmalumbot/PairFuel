<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#07130e" />
    <title>PairFuel is offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; background: radial-gradient(circle at 70% 0, #184d31, transparent 38%), #07130e; color: #f5fff8; }
      main { width: min(420px, 100%); text-align: center; padding: 28px; border: 1px solid #254333; border-radius: 24px; background: #102219; }
      .heart { font-size: 46px; }
      h1 { margin: 14px 0 8px; }
      p { margin: 0 0 20px; color: #a9c4b4; line-height: 1.55; }
      button { width: 100%; border: 0; border-radius: 14px; padding: 14px 18px; background: #7bf59f; color: #06220f; font: inherit; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <div class="heart" aria-hidden="true">♥</div>
      <h1>No connection</h1>
      <p>PairFuel needs an internet connection to sync your health logs securely.</p>
      <button type="button" onclick="location.href='https://pairfuel.vercel.app'">Try again</button>
    </main>
  </body>
</html>
